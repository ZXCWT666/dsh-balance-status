name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build client bundle
        run: node scripts/build-client.mjs

      - name: Materialize smoke test
        run: node scripts/smoke-client.mjs

      - name: Verify committed bundle is in sync
        run: git diff --exit-code -- lib/client.js

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate package manifest (dsh.client / bundle / exports)
        run: node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch) throw new Error('missing dsh.bundle.patch'); if(p.dsh.client?.platform!=='web') throw new Error('bad dsh.client.platform'); if(!p.exports['./client']) throw new Error('missing ./client export'); console.log('manifest ok')"
